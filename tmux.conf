# System tmux config for the code-server sandbox image (→ /etc/tmux.conf).
# Applies to every user with no dotfiles needed.

# Pass kitty extended key sequences (e.g. Shift+Enter) through to apps like Claude Code.
set -g extended-keys on

# OSC 52 clipboard for KEYBOARD copy-mode (prefix-[ … y): tmux copies to a buffer,
# emits OSC 52, mobile-controller.js writes it to the browser clipboard.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# ── Scrollback: tmux owns it, the browser owns none ────────────────────────────
# xterm.js scrollback is one flat client-side buffer for the whole terminal, but
# tmux repaints only the visible screen — it never replays history. So every
# window switch, pane redraw and keyboard-driven resize leaves the browser
# buffer holding lines tmux has already moved on from: scrolling up shows the
# other window's output and torn repaint fragments. It also dies on refresh.
# tmux history has none of those problems: it is server-side, per-window, and
# survives reattach. So the browser keeps zero scrollback (ttyd passes
# scrollback=0, see start-ttyd.sh) and every scroll goes to tmux copy-mode.
set -g history-limit 50000

# Mouse ON — required for the above: it is what makes wheel/drag-scroll enter
# copy-mode and page through tmux's history instead of the browser's buffer.
# Selection becomes tmux's rather than xterm.js's; that still reaches the system
# clipboard because set-clipboard emits OSC 52, which mobile-controller.js
# intercepts. Right-click is handled there too (it re-enables the browser menu).
set -g mouse on

# Alternate screen left ENABLED (no smcup@/rmcup@ override). Full-screen apps
# (vim, less, Claude Code) get a real alt-screen, so their repaints never enter
# history. Claude's fullscreen renderer (CLAUDE_CODE_NO_FLICKER=1 in
# /etc/zsh/zshrc) requests SGR mouse reporting, so with mouse on tmux forwards
# the wheel to Claude, which scrolls its own transcript. In a plain shell the
# wheel enters copy-mode instead.

# New windows open in the session's working directory, which tmux takes from
# whichever client created the session. ttyd passes --cwd /data/workspace, but
# the Termux/et client runs `tmux new-session -A -s main` from $HOME, so after a
# pod restart the session is pinned to /data/home if the phone connects first.
# Re-pin every new session to the workspace, whoever creates it. attach-session
# -c is the only command that changes a session's directory; it complains that
# run-shell has no terminal but still applies the change.
set-hook -g session-created 'run-shell "tmux -S #{socket_path} attach-session -t \"#{hook_session_name}\" -c /data/workspace 2>/dev/null; true"'
